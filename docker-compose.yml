# Docker keeps container logs forever by default; cap each service at 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      JEV_URL: http://jev:8017
      EMBED_URL: http://embed:8018
    volumes:
      - ./data:/app/data
    # Caps take effect only where the kernel has memory cgroups (the Pi needs
    # cgroup_enable=memory cgroup_memory=1 in /boot/firmware/cmdline.txt).
    mem_limit: 512m
    logging: *logging

  # jevos on llama.cpp, for RSS filtering. No published port: only the bot reaches it.
  jev:
    build: docker/jev
    restart: unless-stopped
    cpus: 2
    mem_limit: 1536m
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8017/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # EmbeddingGemma 2 on llama.cpp, for the RSS repeat check. No published port either.
  embed:
    build: docker/embed
    restart: unless-stopped
    cpus: 1
    mem_limit: 768m
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8018/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
